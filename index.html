<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (() => {
        try { document.documentElement.lang = localStorage.getItem('portfolio-language') === 'en' ? 'en' : 'es'; } catch {}
        let theme = 'light';
        try { if (localStorage.getItem('portfolio-theme') === 'dark') theme = 'dark'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#09090B' : '#FFFFFF';
        const connection = navigator.connection;
        if ((!location.hash || location.hash === '#inicio') && !matchMedia('(prefers-reduced-motion: reduce)').matches && !connection?.saveData && !/(^|-)2g/.test(connection?.effectiveType || '')) {
          document.documentElement.dataset.particlePhase = 'loading';
          setTimeout(() => {
            if (document.documentElement.dataset.particlePhase === 'loading') {
              document.documentElement.dataset.particlePhase = 'complete';
              window.dispatchEvent(new Event('particle-intro-timeout'));
            }
          }, 8000);
        }
      })();
    </script>
    <style>html{background:#fff;color:#212121}html[data-theme="dark"]{background:#09090b;color:#fff;color-scheme:dark}</style>
    <meta name="description" content="Transformo necesidades de negocio en soluciones tecnológicas, combinando desarrollo de software, análisis de datos y mejora de procesos." />
    <title>Camilla Espinoza — Desarrollo &amp; Datos</title>
    <link rel="icon" href="/src/app/shared/assets/logo.webp" type="image/webp" />
    <link rel="preload" as="image" href="/src/app/features/home/assets/hero-fondo-1280.webp" media="(max-width: 1280px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/app/features/home/assets/hero-fondo-1802.webp" media="(min-width: 1281px)" fetchpriority="high" />
    <link rel="preload" href="/src/app/shared/assets/fonts/urbanist-7981ef90c246.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <a class="skip-link" href="#inicio">Saltar al contenido</a>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
