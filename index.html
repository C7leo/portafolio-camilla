<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (() => {
        let theme = 'light';
        try { if (localStorage.getItem('portfolio-theme') === 'dark') theme = 'dark'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#09090B' : '#FFFFFF';
        const reload = performance.getEntriesByType('navigation')[0]?.type === 'reload';
        let seen = false;
        try { seen = sessionStorage.getItem('camilla-cinematic-intro-seen') === '1'; } catch {}
        const home = !location.hash || location.hash === '#inicio';
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches && (reload || (home && !seen))) {
          document.documentElement.dataset.introPending = '';
          // Fail open to the static page if the application cannot bootstrap.
          setTimeout(() => { delete document.documentElement.dataset.introPending; }, 15000);
        }
      })();
    </script>
    <style>html{background:#fff;color:#212121}html[data-theme="dark"]{background:#09090b;color:#fff;color-scheme:dark}html[data-intro-pending] body::before{content:'';position:fixed;inset:0;z-index:2147483647;background:#0b0b12 url('/src/app/shell/intro/assets/cinematic-intro-poster.webp') right center/cover no-repeat;pointer-events:none}@media(max-width:820px){html[data-intro-pending] body::before{background-position:center}}</style>
    <meta name="description" content="Transformo necesidades de negocio en soluciones tecnológicas, combinando desarrollo de software, análisis de datos y mejora de procesos." />
    <title>Camilla Espinoza — Desarrollo &amp; Datos</title>
    <link rel="icon" href="/src/app/shared/assets/logo-72.webp" type="image/webp" />
    <link rel="preload" as="image" href="/src/app/shell/intro/assets/cinematic-intro-poster.webp" media="(prefers-reduced-motion: no-preference)" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/app/shared/assets/night-lily-960.webp" media="(max-width: 640px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/app/shared/assets/night-lily.webp" media="(min-width: 641px)" fetchpriority="high" />
    <link rel="preload" href="/src/app/shared/assets/fonts/urbanist-7981ef90c246.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <a class="skip-link" href="#inicio">Saltar al contenido</a>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
