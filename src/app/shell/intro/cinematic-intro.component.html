<dialog #screen class="cinematic-screen" [attr.aria-label]="language.language() === 'es' ? 'Introducción cinematográfica' : 'Cinematic introduction'"
  (cancel)="cancel($event)" (keydown)="preventNavigation($event)">
  <div #still class="cinematic-still" aria-hidden="true"></div>
  <video #film class="cinematic-film" [poster]="posterSrc" autoplay muted playsinline preload="auto" aria-hidden="true"
    (timeupdate)="nearEnd()" (ended)="finish('ended')" (error)="finish('unavailable')" (playing)="playing()" (waiting)="waiting()"></video>
  <button class="skip-intro" type="button" autofocus (click)="finish('skipped')">
    <span>{{ language.language() === 'es' ? 'Omitir intro' : 'Skip intro' }}</span>
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="M3 10h10M9 6l4 4-4 4M17 5v10" /></svg>
  </button>
</dialog>
