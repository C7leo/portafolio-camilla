<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="horizontal">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".14" stop-color="white"/>
      <stop offset=".86" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vertical" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".12" stop-color="white"/>
      <stop offset=".84" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="soft-edges" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900" style="mask-type:alpha">
      <rect width="1600" height="900" fill="url(#vertical)"/>
    </mask>
  </defs>
  <rect width="1600" height="900" fill="url(#horizontal)" mask="url(#soft-edges)"/>
</svg>
